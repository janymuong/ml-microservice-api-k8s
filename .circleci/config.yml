# Python CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.1/language-python/ for more details
#
version: 2.1
jobs:
    build:
        docker:
            # Use the same Docker base as the project
            - image: python:3.13
        
        working_directory: ~/repo
        
        steps:
            - run:
                name: Checkout code
                command: |
                    git clone \
                        --filter=blob:none \
                        --branch "$CIRCLE_BRANCH" \
                        "https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git" \
                        /tmp/checkout
                    cp -a /tmp/checkout/. ~/repo/
                    rm -rf /tmp/checkout
                    cd ~/repo && git checkout -q "$CIRCLE_SHA1"
            
            # Download and cache dependencies
            - restore_cache:
                keys:
                - v1-dependencies-{{ checksum "requirements-dev.txt" }}
                # fallback to using the latest cache if no exact match is found
                - v1-dependencies-
            
            - run:
                name: install dependencies
                command: |
                    python3 -m venv devops
                    . devops/bin/activate
                    make install
                    # Install hadolint in virtualenv for linting
                    wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 &&\
                    chmod +x /bin/hadolint
            - save_cache:
                paths:
                    - ./devops
                key: v1-dependencies-{{ checksum "requirements-dev.txt" }}
                
            # run lint
            - run:
                name: run lint
                command: |
                    . devops/bin/activate
                    make lint

            # run tests
            - run:
                name: run tests
                command: |
                    . devops/bin/activate
                    make test
